server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compress text-based assets
    gzip            on;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/json
                    application/javascript text/javascript
                    image/svg+xml application/wasm;

    # Long-lived cache for hashed bundles (Vite fingerprints JS/CSS filenames)
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
    }

    # SPA fallback – all unmatched paths serve index.html (wouter handles routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}