name: Build & Push Backend

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Забираем код
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Проверка структуры (можешь потом удалить)
      - name: Debug structure
        run: |
          ls
          ls qamqor
          ls qamqor/artifacts/backend

      # 3. Логин в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Билд backend (КЛЮЧЕВОЙ ФИКС ЗДЕСЬ)
      - name: Build image
        run: |
          docker build \
            -f qamqor/artifacts/backend/Dockerfile \
            -t bekssa/qamqor-backend:latest \
            -t bekssa/qamqor-backend:${{ github.sha }} \
            qamqor

      # 5. Пуш
      - name: Push image
        run: |
          docker push bekssa/qamqor-backend:latest
          docker push bekssa/qamqor-backend:${{ github.sha }}
