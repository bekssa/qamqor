name: Build & Push Backend Image

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: |
          docker build \
            -f artifacts/backend/Dockerfile \
            -t bekssa/qamqor-backend:latest \
            -t bekssa/qamqor-backend:${{ github.sha }} \
            .

      - name: Push image
        run: |
          docker push bekssa/qamqor-backend:latest
          docker push bekssa/qamqor-backend:${{ github.sha }}
